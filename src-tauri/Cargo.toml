[package]
name = "yad"
version = "1.0.2"
description = "YAD — Yet Another Downloader"
authors = ["Samson Rapando"]
edition = "2021"
license = "Apache-2.0"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "yad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yad-core = { workspace = true }
yadd = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
