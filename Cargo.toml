[workspace]
resolver = "2"
members = ["crates/yad-core", "crates/yadd", "src-tauri"]

[workspace.dependencies]
yad-core = { path = "crates/yad-core" }
yadd = { path = "crates/yadd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
