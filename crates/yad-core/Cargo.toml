[package]
name = "yad-core"
version = "1.0.2"
description = "Download engine, storage and IPC for YAD"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-util = "0.7"
futures-util = "0.3"
interprocess = { version = "2", features = ["tokio"] }
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
roxmltree = "0.20"
thiserror = "1"
notify-rust = "4"

[dev-dependencies]
tempfile = "3"
