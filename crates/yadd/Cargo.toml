[package]
name = "yadd"
version = "2.0.1"
description = "YAD background download service"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "yadd"
path = "src/lib.rs"

[[bin]]
name = "yadd"
path = "src/main.rs"

[dependencies]
yad-core = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
