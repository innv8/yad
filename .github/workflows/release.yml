name: Release (macOS Apple Silicon)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Bump version from conventional commits
        id: bump
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"

          if git describe --exact-match HEAD 2>/dev/null; then
            echo "HEAD already tagged — nothing new to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump type from commit messages since last tag
          BUMP="skip"
          while IFS= read -r line; do
            line="${line## }"
            [ -z "$line" ] && continue
            case "$line" in
              *"BREAKING CHANGE"*) BUMP="major" ;;
              *\!:*) [ "$BUMP" != "major" ] && BUMP="major" ;;
              feat*) [ "$BUMP" != "major" ] && BUMP="minor" ;;
              fix*) [ "$BUMP" = "skip" ] && BUMP="patch" ;;
            esac
          done < <(git log "${LAST_TAG}..HEAD" --format="%B" --no-merges)

          if [ "$BUMP" = "skip" ]; then
            echo "No feat/fix/breaking commits found — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Bump type: $BUMP"

          # Parse and bump semver
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          BASE="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update version in config files
          jq ".version = \"$NEW_VERSION\"" src-tauri/tauri.conf.json > /tmp/tc.json
          mv /tmp/tc.json src-tauri/tauri.conf.json

          for f in src-tauri/Cargo.toml crates/yad-core/Cargo.toml crates/yadd/Cargo.toml; do
            sed -i 's/^version = ".*"/version = "'"$NEW_VERSION"'"/' "$f"
          done
          jq ".version = \"$NEW_VERSION\"" extension/manifest.json > /tmp/mf.json
          mv /tmp/mf.json extension/manifest.json

          # Commit, tag, push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml crates/yad-core/Cargo.toml crates/yadd/Cargo.toml extension/manifest.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  # Apple Silicon is built on every push to main, together with the browser extension
  # (same version). Other platforms: build-platforms.yml.
  macos-arm64:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      target: aarch64-apple-darwin
      bundles: app,dmg
      label: macos-arm64
      ref: ${{ needs.version.outputs.should_release == 'true' && format('v{0}', needs.version.outputs.version) || '' }}
      release_tag: ${{ needs.version.outputs.should_release == 'true' && format('v{0}', needs.version.outputs.version) || '' }}
      include_extension: true

