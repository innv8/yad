name: Test

# Only macOS (Apple Silicon) and the browser extension are tested for now.
# Windows and Linux builds can still be made by hand with build-platforms.yml.

on:
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Lets the end-to-end tests download real HLS/DASH video and join the tracks.
      - name: Install ffmpeg
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # Engine, storage, parsers and end-to-end downloads against a local test server.
      - run: cargo test -p yad-core -p yadd
        env:
          YAD_SKIP_NATIVE_HOST: "1"

      # The app crate only needs to compile; it has no unit tests of its own.
      - run: cargo build -p yad

  ui:
    # The same screens rendered by Chromium and WebKit (the engine behind the macOS app)
    # must lay out identically.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium webkit
      - run: npm run test:ui
      - name: Keep screenshots when the layout test fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-output
          path: tests/ui/.output

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: App, service and extension versions match
        run: |
          APP=$(jq -r .version src-tauri/tauri.conf.json)
          for v in "$(jq -r .version extension/manifest.json)" \
                   "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)" \
                   "$(grep -m1 '^version' crates/yad-core/Cargo.toml | cut -d'"' -f2)" \
                   "$(grep -m1 '^version' crates/yadd/Cargo.toml | cut -d'"' -f2)"; do
            if [ "$v" != "$APP" ]; then echo "::error::Version mismatch: app is $APP, found $v"; exit 1; fi
          done
          echo "All at $APP"

      - name: Syntax-check extension scripts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check
