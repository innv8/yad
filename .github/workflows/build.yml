# Builds YAD for one platform. Called by release.yml (Apple Silicon, on every push to
# main) and build-platforms.yml (other platforms, run by hand).
name: Build (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner image
        required: true
        type: string
      target:
        description: Rust target triple
        required: true
        type: string
      bundles:
        description: Tauri bundle formats (comma separated)
        required: true
        type: string
      label:
        description: Platform label used in file names, e.g. macos-arm64
        required: true
        type: string
      ref:
        description: Git ref to build (a release tag, or empty for the triggering commit)
        required: false
        type: string
        default: ""
      release_tag:
        description: Attach the build to this GitHub release (empty = artifact only)
        required: false
        type: string
        default: ""
      include_extension:
        description: Also package the YAD Link browser extension (same version as the app)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      # Keeps compiled dependencies between runs, also when a build fails half way.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.target }}
          cache-on-failure: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf

      # The prebuilt CLI from npm takes seconds; `cargo install tauri-cli` compiles for ~10 min.
      - name: Build app
        working-directory: src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --target ${{ inputs.target }} --bundles ${{ inputs.bundles }}

      - name: Build background service (yadd)
        run: cargo build --release -p yadd --target ${{ inputs.target }}

      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          OUT="target/${{ inputs.target }}/release"
          mkdir -p dist
          find "$OUT/bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) \
            ! -name 'rw.*' -exec cp {} dist/ \;
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          cp "$OUT/yadd$EXT" "dist/yadd-v$VERSION-${{ inputs.label }}$EXT"
          ls -la dist

      - name: Package browser extension
        if: inputs.include_extension
        shell: bash
        run: |
          set -euo pipefail
          APP=$(jq -r .version src-tauri/tauri.conf.json)
          EXT=$(jq -r .version extension/manifest.json)
          if [ "$APP" != "$EXT" ]; then
            echo "::error::The app is $APP but the extension is $EXT. Set extension/manifest.json to $APP."
            exit 1
          fi
          (cd extension && zip -qr "../dist/yad-link-extension-v$APP.zip" . -x '*.md')
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: yad-${{ inputs.label }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*
