# Builds for Windows, Linux and Intel Macs. Run it by hand from the Actions tab
# (Actions → Build other platforms → Run workflow).
name: Build other platforms

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, windows-x64, linux-x64, macos-x64]
      release_tag:
        description: Attach to this release tag, e.g. v1.1.0 (leave empty for artifacts only)
        type: string
        default: ""

permissions:
  contents: write

jobs:
  windows-x64:
    if: inputs.platform == 'all' || inputs.platform == 'windows-x64'
    uses: ./.github/workflows/build.yml
    with:
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      bundles: nsis
      label: windows-x64
      ref: ${{ inputs.release_tag }}
      release_tag: ${{ inputs.release_tag }}

  linux-x64:
    if: inputs.platform == 'all' || inputs.platform == 'linux-x64'
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      bundles: deb,appimage
      label: linux-x64
      ref: ${{ inputs.release_tag }}
      release_tag: ${{ inputs.release_tag }}

  macos-x64:
    if: inputs.platform == 'all' || inputs.platform == 'macos-x64'
    uses: ./.github/workflows/build.yml
    with:
      # Cross-compiled on Apple Silicon; GitHub is retiring its Intel macOS runners.
      runner: macos-latest
      target: x86_64-apple-darwin
      bundles: app,dmg
      label: macos-x64
      ref: ${{ inputs.release_tag }}
      release_tag: ${{ inputs.release_tag }}
